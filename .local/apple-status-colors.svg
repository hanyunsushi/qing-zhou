<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <rect width="1120" height="360" fill="#f5f5f7"/>
  <text x="56" y="58" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#1d1d1f">Apple 风格状态色</text>
  <text x="56" y="91" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6e6e73">状态牌：实色背景 + 白色文字</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <rect x="56" y="125" width="190" height="145" rx="16" fill="#34c759"/>
    <text x="78" y="165" font-size="18" font-weight="700" fill="#fff">正常</text>
    <text x="78" y="200" font-size="16" fill="#fff">#34C759</text>
    <text x="78" y="243" font-size="14" fill="#fff">Success</text>

    <rect x="270" y="125" width="190" height="145" rx="16" fill="#ff9500"/>
    <text x="292" y="165" font-size="18" font-weight="700" fill="#fff">警告 / 高负载</text>
    <text x="292" y="200" font-size="16" fill="#fff">#FF9500</text>
    <text x="292" y="243" font-size="14" fill="#fff">Warning</text>

    <rect x="484" y="125" width="190" height="145" rx="16" fill="#ff3b30"/>
    <text x="506" y="165" font-size="18" font-weight="700" fill="#fff">错误 / 严重</text>
    <text x="506" y="200" font-size="16" fill="#fff">#FF3B30</text>
    <text x="506" y="243" font-size="14" fill="#fff">Error</text>

    <rect x="698" y="125" width="190" height="145" rx="16" fill="#8e8e93"/>
    <text x="720" y="165" font-size="18" font-weight="700" fill="#fff">无数据</text>
    <text x="720" y="200" font-size="16" fill="#fff">#8E8E93</text>
    <text x="720" y="243" font-size="14" fill="#fff">Inactive</text>

    <rect x="912" y="125" width="152" height="145" rx="16" fill="#007aff"/>
    <text x="934" y="165" font-size="18" font-weight="700" fill="#fff">信息</text>
    <text x="934" y="200" font-size="16" fill="#fff">#007AFF</text>
    <text x="934" y="243" font-size="14" fill="#fff">Info</text>
  </g>
</svg>
